# Daily aggregator: pulls the latest NEWS.md entry from each ROvis.* family
# package and rebuilds vignettes/articles/family-release-notes.qmd, a single
# combined "what's new across the family" page for this repo's pkgdown site.
#
# Commits straight to the default branch since this is generated content with
# no human authorship, so nothing to review in a PR. The branch ruleset
# requires PRs, so checkout uses the DEPLOY_KEY, which is on the
# ruleset's bypass list; GITHUB_TOKEN pushes would be rejected.
name: family-release-notes

on:
  schedule:
    # minute hour day month weekday -> 06:17 UTC daily
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  update-family-release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      # NEWS.md is read at the latest release tag, not the default branch: between
      # releases main starts with the unreleased "(development version)" section.
      - name: Fetch NEWS.md from the family packages
        env:
          GH_TOKEN: ${{ secrets.AT_ROvis || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .family-release-notes
          for pkg in ROvis.utils ROvis.ggplot2 ROvis.plotly ROvis.echarts ROvis.table ROvis.shiny; do
            # Latest GitHub release, e.g. v0.2.0; empty if the package has no release yet
            tag=$(gh release view --repo "rivm-syso/${pkg}" --json tagName --jq .tagName 2>/dev/null || true)
            if [ -n "$tag" ]; then
              gh api "repos/rivm-syso/${pkg}/contents/NEWS.md?ref=${tag}" \
                -H "Accept: application/vnd.github.raw+json" > ".family-release-notes/${pkg}.md"
            fi
          done

      - name: Build combined family release notes page
        run: .github/scripts/build-family-release-notes.sh

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vignettes/articles/family-release-notes.qmd
          if git diff --cached --quiet; then
            echo "No changes to family release notes."
            exit 0
          fi
          git commit -m "chore: update family release notes [skip ci]"
          git push
